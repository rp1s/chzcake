# Cost-efficient global Codex profile.
# File: $CODEX_HOME/config.toml
# Low reasoning effort for most everyday tasks.

model_reasoning_effort = "low"

# Keep model responses concise.

model_verbosity = "low"

# Do not generate detailed reasoning summaries.

model_reasoning_summary = "none"

# Limit the size of each tool result
# retained in the session history.

tool_output_token_limit = 4000

# Limit the total size of AGENTS.md instructions.
# 12 KiB is sufficient for a compact global file.

project_doc_max_bytes = 12288

# Allow safe write access only within the workspace.

sandbox_mode = "workspace-write"

# Ask before performing actions that require elevated permissions.

approval_policy = "on-request"

[features]

# Sub-agents create separate contexts and model calls.

multi_agent = false

# Do not retain additional cross-session memory.

memories = false

[agents]

# Additional safeguard in case multi-agent mode is temporarily enabled.

max_concurrent_threads_per_session = 1

[sandbox_workspace_write]

# Do not grant commands network access by default.

network_access = false